services:
  examgen-ai:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://examgen:examgen_dev_only@db:5432/examgen}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-development-only-change-this-secret-before-deploy}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      DOCUMENT_STORAGE_PATH: /srv/examgen/data/documents
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-af-south-1}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_SERVER_SIDE_ENCRYPTION: ${OBJECT_STORAGE_SERVER_SIDE_ENCRYPTION-AES256}
      MAX_DOCUMENT_UPLOAD_BYTES: ${MAX_DOCUMENT_UPLOAD_BYTES:-20000000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MALWARE_SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
      DOCUMENT_JOB_LEASE_SECONDS: ${DOCUMENT_JOB_LEASE_SECONDS:-3600}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-100}
      MAX_PDF_PAGE_PIXELS: ${MAX_PDF_PAGE_PIXELS:-20000000}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-15}
      MAX_EXTRACTED_CHARACTERS: ${MAX_EXTRACTED_CHARACTERS:-10000000}
      MAX_OFFICE_ARCHIVE_RATIO: ${MAX_OFFICE_ARCHIVE_RATIO:-100}
    ports:
      - "8000:8000"
    volumes:
      - examgen-document-data:/srv/examgen/data/documents
    depends_on:
      db:
        condition: service_healthy
      minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-examgen-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-minio-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - examgen-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  clamav:
        condition: service_healthy
    restart: unless-stopped

  document-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://examgen:examgen_dev_only@db:5432/examgen}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-development-only-change-this-secret-before-deploy}
      DOCUMENT_STORAGE_PATH: /srv/examgen/data/documents
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-af-south-1}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      MALWARE_SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      DOCUMENT_JOB_LEASE_SECONDS: ${DOCUMENT_JOB_LEASE_SECONDS:-3600}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-100}
      MAX_PDF_PAGE_PIXELS: ${MAX_PDF_PAGE_PIXELS:-20000000}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-15}
      MAX_EXTRACTED_CHARACTERS: ${MAX_EXTRACTED_CHARACTERS:-10000000}
      MAX_OFFICE_ARCHIVE_RATIO: ${MAX_OFFICE_ARCHIVE_RATIO:-100}
    volumes:
      - examgen-document-data:/srv/examgen/data/documents
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    volumes:
      - examgen-clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examgen_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-examgen}
    volumes:
      - examgen-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examgen} -d ${POSTGRES_DB:-examgen}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  examgen-postgres-data:
  examgen-document-data:
  examgen-clamav-data:
  examgen-minio-data:

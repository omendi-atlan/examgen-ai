name: CI

on:
  push:
    branches: [main, "architecture/**", "build/**"]
  pull_request:
    branches: [main, "architecture/**", "build/**"]

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: touch .env && docker compose config --quiet
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  validate-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: examgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examgen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/examgen_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/examgen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend
      - run: alembic upgrade head
      - run: pytest

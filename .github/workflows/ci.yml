name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Byte-compile
        run: python -m compileall -q examgen tests app.py
      - name: Tests
        env:
          EXAMGEN_SECRET_KEY: ci-secret-key-not-for-production-use
        run: python -m pytest -q
      - name: CLI smoke test
        env:
          EXAMGEN_SECRET_KEY: ci-secret-key-not-for-production-use
          EXAMGEN_DATA_DIR: ${{ runner.temp }}/examgen-ci
        run: |
          examgen init-db
          examgen --help

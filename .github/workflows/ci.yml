name: CI

on:
  push:
    branches: [main, "architecture/**", "build/**"]
  pull_request:
    branches: [main, "architecture/**", "build/**"]

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: touch .env && docker compose config --quiet
      - run: npm run typecheck
      # Student exam delivery stays framework-independent and is syntax-checked directly.
      - run: node --check public/practice/app.js
      - run: npm run lint
      - run: npm run build

  validate-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: examgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examgen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping=3"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 120s
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/examgen_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/examgen_test
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend
      - run: alembic upgrade head
      - run: pytest
